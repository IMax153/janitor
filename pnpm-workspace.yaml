  clsx: ^2.1.1
  effect: 4.0.0-rc.112
  foldkit: ^0.152.0
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: ^0.3.0

overrides:
  "@effect/vitest": link:../effect/packages/vitest
  "web>effect": "catalog:"
