packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@effect/platform-browser": 4.0.0-rc.111
  "@effect/platform-node": 4.0.0-rc.111
  "@effect/tsgo": ^0.36.5
  "@foldkit/devtools": ^0.150.0
  "@foldkit/devtools-mcp": ^0.17.0
  "@foldkit/oxlint-plugin": ^0.6.0
  "@foldkit/ui": ^0.150.0
  "@foldkit/vite-plugin": ^0.17.0
  "@fontsource-variable/geist": ^5.3.0
  "@tailwindcss/vite": ^4.3.3
  "@types/node": ^24
  alchemy: 2.0.0-beta.74
  clsx: ^2.1.1
  effect: 4.0.0-rc.111
  foldkit: ^0.150.0
  lucide: ^1.33.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: ^0.2.9

overrides:
